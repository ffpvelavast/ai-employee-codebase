<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap');

  .asap-reviews-section {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff;
    padding: 80px 20px;
    color: #0f172a;
    box-sizing: border-box;
  }

  .asap-reviews-container {
    max-width: 1248px;
    margin: 0 auto;
    width: 100%;
  }

  .asap-reviews-header {
    text-align: center;
    max-width: 768px;
    margin: 0 auto 64px auto;
  }

  .asap-eyebrow {
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #155EEF;
    font-size: 0.72rem;
    font-weight: 700;
    margin: 0;
  }

  .asap-reviews-title {
    font-family: 'Sora', sans-serif;
    font-size: 2rem;
    line-height: 1.08;
    font-weight: 700;
    color: #0f172a;
    margin: 16px 0 0 0;
    letter-spacing: -0.028em;
  }

  @media (min-width: 640px) {
    .asap-reviews-title {
      font-size: 3rem;
    }
  }

  .asap-reviews-desc {
    margin: 24px 0 0 0;
    font-size: 1rem;
    line-height: 1.625;
    color: #64748b;
  }

  @media (min-width: 640px) {
    .asap-reviews-desc {
      font-size: 1.125rem;
    }
  }

  .asap-reviews-masonry {
    column-count: 1;
    column-gap: 24px;
    width: 100%;
    max-width: 1152px;
    margin: 0 auto;
  }

  @media (min-width: 640px) {
    .asap-reviews-masonry {
      column-count: 2;
    }
  }

  @media (min-width: 1024px) {
    .asap-reviews-masonry {
      column-count: 3;
    }
  }

  .asap-review-card {
    break-inside: avoid;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    background-color: #ffffff;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.05);
    display: flex;
    flex-direction: column;
  }

  .asap-review-main-card {
    align-items: center;
    text-align: center;
  }

  .asap-google-logo {
    height: 32px;
    margin-bottom: 8px;
  }

  .asap-main-card-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0;
  }

  .asap-rating-container {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .asap-rating-score {
    font-weight: 700;
    font-size: 1.125rem;
  }

  .asap-stars {
    display: flex;
    color: #fbbc04;
  }

  .asap-stars svg {
    width: 20px;
    height: 20px;
  }

  .asap-review-count {
    font-size: 0.75rem;
    color: #64748b;
    margin: 4px 0 16px 0;
  }

  .asap-review-btn {
    width: 100%;
    padding: 10px;
    background-color: #000000;
    color: #ffffff;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .asap-review-btn:hover {
    background-color: #1f2937;
  }

  /* User review cards */
  .asap-user-review-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .asap-user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #f1f5f9;
    object-fit: cover;
  }

  .asap-user-name {
    font-size: 0.875rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0;
  }

  .asap-user-time {
    font-size: 0.75rem;
    color: #64748b;
    margin: 0;
  }

  .asap-user-stars {
    display: flex;
    color: #fbbc04;
    margin-bottom: 12px;
  }

  .asap-user-stars svg {
    width: 16px;
    height: 16px;
  }

  .asap-user-text {
    font-size: 0.875rem;
    color: rgba(15, 23, 42, 0.8);
    line-height: 1.625;
    margin: 0 0 16px 0;
    flex: 1;
  }

  .asap-user-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
  }

  .asap-user-link {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #64748b;
    text-decoration: none;
    transition: color 0.2s;
  }

  .asap-user-link:hover {
    color: #0f172a;
  }

  .asap-user-share {
    color: rgba(21, 94, 239, 0.7);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: grid;
    place-items: center;
    transition: color 0.2s;
  }

  .asap-user-share:hover {
    color: #155EEF;
  }
</style>

<section id="reviews" class="asap-reviews-section">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" /></svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" /></svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" /></svg>
          </div>
        </div>
        <p class="asap-review-count">Read our 599 Reviews</p>
        <button class="asap-review-btn">
          Write a review
        </button>
      </div>

    </div>
  </div>
</section>

    reviews.forEach(review => {
      const card = document.createElement('div');
      card.className = "asap-review-card";

      const stars = Array(5).fill('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" /></svg>').join('');

          </button>
        </div>
      `;
      container.appendChild(card);

</script>
