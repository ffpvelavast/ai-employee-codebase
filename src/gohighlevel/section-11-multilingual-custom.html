<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  .asap-multilingual-section {
    font-family: 'Inter', sans-serif;
    color: #0f172a;
    width: 100%;
    box-sizing: border-box;
    background-color: #ffffff;
    padding: 100px 20px;
  }

  .asap-container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .asap-multilingual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  @media (max-width: 1024px) {
    .asap-multilingual-grid {
      grid-template-columns: 1fr;
      gap: 48px;
    }
  }

  /* Left Side: Text */
  .asap-eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #3b82f6; /* Blue */
    margin-bottom: 16px;
    display: block;
  }

  .asap-title {
    font-size: 44px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #0f172a; /* Navy */
    margin: 0 0 20px 0;
  }

  .asap-desc {
    font-size: 16px;
    line-height: 1.6;
    color: #64748b; /* Muted foreground */
    max-width: 450px;
    margin: 0;
  }

  /* Right Side: Chips */
  .asap-chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .asap-lang-chip {
    background-color: #ffffff;
    border: 1px solid #e2e8f0; /* Hairline */
    border-radius: 9999px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #0f172a;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); /* soft shadow */
    transition: all 0.3s ease;
    cursor: default;
  }

  .asap-lang-chip:hover {
    border-color: rgba(59, 130, 246, 0.4); /* blue/40 */
    color: #3b82f6;
  }

  .asap-lang-chip-more {
    background-color: #eff6ff; /* blue-soft */
    border-radius: 9999px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #3b82f6;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
</style>

<section class="asap-multilingual-section" id="multilingual">
  <div class="asap-container">
    <div class="asap-multilingual-grid">
      
      <!-- Left: Text -->
      <div>
        <span class="asap-eyebrow">Multilingual</span>
        <h2 class="asap-title">Speak Your Customer's Language.</h2>
        <p class="asap-desc">
          Your customers can interact naturally in the languages they are most comfortable using.
        </p>
      </div>

      <!-- Right: Chips -->
      <div class="asap-chips-container">
        <span class="asap-lang-chip">English</span>
        <span class="asap-lang-chip">Mandarin</span>
        <span class="asap-lang-chip">Bahasa</span>
        <span class="asap-lang-chip">Thai</span>
        <span class="asap-lang-chip">Korean</span>
        <span class="asap-lang-chip">Japanese</span>
        
        <span class="asap-lang-chip-more">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
          More
        </span>
      </div>

    </div>
  </div>
</section>
