<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  .asap-video-section {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff; /* Surface tone */
    color: #0f172a;
    padding: 100px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    width: 100%;
  }

  .asap-video-header {
    text-align: center;
    max-width: 800px;
    margin-bottom: 48px;
  }

  .asap-video-title {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.03em;
    color: #0f172a; /* Navy */
    margin: 0 0 20px 0;
  }

  .asap-video-title-highlight {
    color: #3b82f6; /* Blue */
  }

  .asap-video-desc {
    font-size: 18px;
    line-height: 1.6;
    color: #64748b; /* Muted foreground */
    margin: 0 auto;
    max-width: 600px;
  }

  .asap-video-container {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    /* Gradient Navy */
    background: linear-gradient(160deg, #0f172a 0%, #090e1a 100%);
    border: 1px solid #e2e8f0; /* Hairline */
    /* Shadow lift */
    box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }
  
  .asap-video-container:hover {
    transform: translateY(-4px);
    box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.35);
  }
  
  /* Iframe placeholder styles in case they drop an iframe */
  .asap-video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 10; /* Goes above the placeholder content */
  }

  .asap-video-placeholder-content {
    text-align: center;
    position: relative;
    z-index: 1; /* Below an iframe if one is added */
  }

  .asap-play-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    margin: 0 auto;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1); /* Navy foreground / 10 */
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    transition: transform 0.3s ease, background-color 0.3s ease;
    cursor: pointer;
  }

  .asap-play-button:hover {
    transform: scale(1.05);
    background-color: rgba(255, 255, 255, 0.15);
  }

  .asap-video-placeholder-title {
    margin: 20px 0 4px 0;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
  }

  .asap-video-placeholder-desc {
    margin: 0;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
  }

  .asap-btn-cta {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #ffffff;
    font-size: 18px; /* size="lg" */
    font-weight: 600;
    padding: 18px 40px;
    border-radius: 9999px;
    text-decoration: none;
    box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .asap-btn-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.4);
  }

  /* Responsive fixes */
  @media (max-width: 768px) {
    .asap-video-title {
      font-size: 36px;
    }
    .asap-video-section {
      padding: 60px 20px;
    }
  }
</style>

<section class="asap-video-section" id="how-it-works">
  
  <div class="asap-video-header">
    <h2 class="asap-video-title">
      What AI Employees <span class="asap-video-title-highlight">Can Do for You?</span>
    </h2>
    <p class="asap-video-desc">
      Watch how AI Employees answer calls, respond on WhatsApp and turn enquiries into booked appointments — around the clock.
    </p>
  </div>

  <div class="asap-video-container">
    <!-- To embed a real YouTube video, uncomment the line below and replace YOUR_VIDEO_ID -->
    <!-- <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allow="autoplay; encrypted-media" allowfullscreen></iframe> -->
    
    <div class="asap-video-placeholder-content">
      <div class="asap-play-button">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
      </div>
      <p class="asap-video-placeholder-title">Your video goes here</p>
      <p class="asap-video-placeholder-desc">Embed your YouTube link in this space</p>
    </div>
  </div>

  <div>
    <button class="asap-btn-cta">Create My AI Demo</button>
  </div>
  
</section>
