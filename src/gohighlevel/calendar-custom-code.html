<script>
(function() {
  /* ========================================================
     INJECT LEFT EDITORIAL CONTENT INTO GHL CALENDAR CONTAINER
     ======================================================== */
  function injectEditorialColumn() {
    const infoContainer = document.querySelector('.appointment_widgets--revamp--info-container');
    if (!infoContainer) return;

    // Check if already injected
    if (infoContainer.querySelector('.asap-cal-left-editorial')) return;

    const editorialEl = document.createElement('div');
    editorialEl.className = 'asap-cal-left-editorial';
    editorialEl.innerHTML = `
      <div class="asap-cal-kicker">AI Employee Design Session &middot; 30 MIN &middot; FREE</div>
      <h2 class="asap-cal-title">
        Like what<br>
        it did?<br>
        <span class="serif-italic">Now let's design the real one</span><span class="period-red">.</span>
      </h2>
      <p class="asap-cal-desc">
        An ASAP AI consultant reviews this demo with you, maps where your enquiries come from and recommends the right first role. No preparation needed.
      </p>
      <div class="asap-cal-bullets">
        <div class="asap-cal-bullet-item">
          <span class="asap-cal-bullet-dot"></span>
          <span>Your customer journey</span>
        </div>
        <div class="asap-cal-bullet-item">
          <span class="asap-cal-bullet-dot"></span>
          <span>Your current channels</span>
        </div>
        <div class="asap-cal-bullet-item">
          <span class="asap-cal-bullet-dot"></span>
          <span>Hand-over to your team</span>
        </div>
        <div class="asap-cal-bullet-item">
          <span class="asap-cal-bullet-dot"></span>
          <span>Scope and a fixed quote</span>
        </div>
      </div>
    `;

    infoContainer.appendChild(editorialEl);
  }

  /* ========================================================
     ENHANCE CONFIRMATION SUCCESS CARD (Matches Image 2)
     ======================================================== */
  function enhanceConfirmationScreen() {
    const confirmContainer = document.querySelector('.appointment_widgets--revamp--confirmation');
    if (!confirmContainer) return;

    if (confirmContainer.querySelector('.asap-confirm-header')) return;

    const header = document.createElement('div');
    header.className = 'asap-confirm-header';
    header.innerHTML = `
      <div class="asap-confirm-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h3 class="asap-confirm-title">Your design session is booked<span class="period-red">.</span></h3>
    `;

    confirmContainer.insertBefore(header, confirmContainer.firstChild);

    // Also update note text if present
    const note = confirmContainer.querySelector('.confirmation-invite-text');
    if (note) {
      note.innerHTML = `Your confirmation and this demo's link are on WhatsApp, and the calendar invite is in your inbox.<br><br><span style="color:#71717a; font-size:13px;">Need to change it? Reply to the WhatsApp confirmation.</span>`;
    }
  }

  /* ========================================================
     ENFORCE TIMEZONE VISIBILITY IN DOM DIRECTLY
     ======================================================== */
  function fixTimezoneDisplay() {
    const tzSingle = document.querySelector('.widgets-timezone-picker .multiselect__single');
    if (tzSingle) {
      tzSingle.style.setProperty('color', '#ffffff', 'important');
      tzSingle.style.setProperty('display', 'inline-flex', 'important');
      tzSingle.style.setProperty('align-items', 'center', 'important');
      tzSingle.style.setProperty('opacity', '1', 'important');
      tzSingle.style.setProperty('visibility', 'visible', 'important');
      const svg = tzSingle.querySelector('svg');
      if (svg) {
        svg.style.setProperty('fill', '#ffffff', 'important');
        svg.style.setProperty('color', '#ffffff', 'important');
        svg.style.setProperty('opacity', '1', 'important');
        svg.style.setProperty('visibility', 'visible', 'important');
      }
    }

    // Direct DOM override to remove white border from any multiselect popups created dynamically
    const wrappers = document.querySelectorAll('.multiselect__content-wrapper');
    wrappers.forEach(function(w) {
      w.style.setProperty('background-color', '#18181b', 'important');
      w.style.setProperty('border', '1px solid #2e2e33', 'important');
      w.style.setProperty('box-shadow', '0 16px 36px rgba(0,0,0,0.85)', 'important');
      const options = w.querySelectorAll('.multiselect__option, .multiselect__option span');
      options.forEach(function(opt) {
        if (!opt.closest('.multiselect__option--selected')) {
          opt.style.setProperty('color', '#ffffff', 'important');
        }
      });
    });

    // Also ensure step-form doesn't get clipped by GHL inline style
    const stepForm = document.querySelector('.appointment_widgets--revamp--steps.step-form');
    if (stepForm) {
      stepForm.style.setProperty('max-height', 'none', 'important');
      stepForm.style.setProperty('overflow', 'visible', 'important');
    }
  }

  /* Observer to handle step navigation in GHL Vue app */
  const observer = new MutationObserver(function() {
    injectEditorialColumn();
    enhanceConfirmationScreen();
    fixTimezoneDisplay();
  });

  observer.observe(document.body, { childList: true, subtree: true });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      injectEditorialColumn();
      enhanceConfirmationScreen();
      fixTimezoneDisplay();
    });
  } else {
    injectEditorialColumn();
    enhanceConfirmationScreen();
    fixTimezoneDisplay();
  }
})();
</script>
